# Deploy to the VPS by itself after every merge to main (owner 2026-10-09: "directly push, dont suggest me do").
# It runs the same vps-setup/5-deploy.sh the owner used to run by hand over SSH.
# One-time setup (repo Settings > Secrets and variables > Actions), values are never written in this repo:
#   VPS_HOST      the server's address
#   VPS_USER      the SSH user (root)
#   VPS_SSH_KEY   a private key whose public half is in that user's ~/.ssh/authorized_keys on the server
# Until the three are set, the job says so and stops green: nothing is deployed.
# Only a push to main (or a manual run) deploys: pull requests and forks never reach the server.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deploy secrets are set
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::notice::VPS_HOST / VPS_USER / VPS_SSH_KEY are not set yet: nothing deployed."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # Plain ssh instead of a third-party action, with a check of the key that never prints it (owner 2026-10-09:
      # "ssh: no key found" twice; the secret was pasted without its BEGIN / END lines or with Windows line ends).
      - name: Check the key and connect
        if: steps.check.outputs.ready == 'yes'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # \r (pasted from some editors) and a literal "\n" (pasted as one line) are made real line ends again.
          printf '%s\n' "$KEY" | tr -d '\r' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          lines=$(grep -c . ~/.ssh/deploy_key || true)
          first=$(head -n1 ~/.ssh/deploy_key | grep -c -- '-----BEGIN' || true)
          last=$(grep -c -- '-----END' ~/.ssh/deploy_key || true)
          echo "VPS_SSH_KEY: $lines lines, BEGIN line on top: $([ "$first" = 1 ] && echo yes || echo NO), END line: $([ "$last" -ge 1 ] && echo yes || echo NO)"
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key. Paste the WHOLE key, from the -----BEGIN line to the -----END line."
            exit 1
          fi
          echo "The key is a valid private key."
          HOSTNAME_ONLY=$(printf '%s' "$HOST" | sed 's/^ *hostname *//' | tr -d ' \r\n')
          USER_ONLY=$(printf '%s' "$USER" | tr -d ' \r\n')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes "$USER_ONLY@$HOSTNAME_ONLY" \
            'set -e; cd /var/www/tracker && bash vps-setup/5-deploy.sh && git log -1 --oneline && (pm2 ls | grep -E " tracker " || true)'
